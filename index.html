<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Hermosillo 2026</title>
    
    <!-- Tailwind CSS para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React y ReactDOM para la UI interactiva -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel para compilar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Iconos Phosphor -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body { font-family: 'Inter', sans-serif; transition: background 1s ease; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        /* Scrollbar estilizado */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.4); }
    </style>
</head>
<body class="min-h-screen text-slate-800 bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

       // URL del CSV de Google Sheets (Reemplazar con tu URL)
        const GOOGLE_SHEETS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSJv3RnKGah_HW0wOLqpnYHUdNxw8TfwEMIyTirT_DJk-13_SPbOj8YGh6WWZCtc7q4A1pQUNLhijsr/pub?output=csv"; 

        // Datos de prueba (Fallback si no hay URL de Google Sheets)
        const MOCK_CSV_DATA = `Fecha,Titulo,Descripcion,Color,Emoji
2026-08-01,Inicio de mes,Planear objetivos,#bfdbfe,🚀
2026-08-15,Cena con amigos,Restaurante en el centro a las 8pm,#fef08a,🌮
2026-09-15,Grito de Independencia,Festejos patrios,#bbf7d0,🇲🇽
2026-10-31,Halloween,Fiesta de disfraces,#e9d5ff,🎃
2026-11-20,Día de la Revolución,Día festivo - descansar,#fecaca,🇲🇽
2026-12-24,Nochebuena,Cena familiar,#fecaca,🎄
2026-12-31,Fin de año,Despedir el 2026,#bfdbfe,🎆
2026-08-10,Junta de proyecto,Revisión de avances,#e2e8f0,💼
2026-10-12,Cita Médica,Chequeo general 10:00 AM,#bfdbfe,🩺`;

        const MONTHS = [
            { name: "Agosto", index: 7, days: 31, startDay: 6 }, // 1 de Ago 2026 es Sábado (0=Dom, 6=Sab)
            { name: "Septiembre", index: 8, days: 30, startDay: 2 }, // 1 de Sep 2026 es Martes
            { name: "Octubre", index: 9, days: 31, startDay: 4 }, // 1 de Oct 2026 es Jueves
            { name: "Noviembre", index: 10, days: 30, startDay: 0 }, // 1 de Nov 2026 es Domingo
            { name: "Diciembre", index: 11, days: 31, startDay: 2 }, // 1 de Dic 2026 es Martes
        ];
        const WEEKDAYS = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];

        const parseCSV = (csvText) => {
            const lines = csvText.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
            
            return lines.slice(1).map(line => {
                // Regex simple para parsear CSV ignorando comas dentro de comillas si las hubiera
                const values = line.split(','); 
                return {
                    date: values[0]?.trim(),
                    title: values[1]?.trim(),
                    description: values[2]?.trim() || "",
                    color: values[3]?.trim() || "#e5e7eb", // Valor HEX por defecto (gris)
                    emoji: values[4]?.trim() || "📌"
                };
            }).filter(event => event.date); // Filtrar filas vacías
        };

        class MarioSynth {
            constructor() {
                this.audioCtx = null;
                this.isPlaying = false;
                this.timeouts = [];
            }

            init() {
                if (!this.audioCtx) {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playNote(frequency, startTime, duration) {
                if (!this.audioCtx) return;
                const osc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();
                
                osc.type = 'square'; // Sonido retro 8-bits
                osc.frequency.value = frequency;
                
                osc.connect(gain);
                gain.connect(this.audioCtx.destination);
                
                // Envolvente de volumen (Attack, Decay)
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.1, startTime + 0.05); // Volumen bajo
                gain.gain.setValueAtTime(0.1, startTime + duration - 0.05);
                gain.gain.linearRampToValueAtTime(0, startTime + duration);
                
                osc.start(startTime);
                osc.stop(startTime + duration);
            }

            playTheme() {
                this.init();
                if (this.audioCtx.state === 'suspended') {
                    this.audioCtx.resume();
                }
                this.isPlaying = true;

                // Frecuencias para la melodía de Mario
                const E5 = 659.25, C5 = 523.25, G5 = 783.99, G4 = 392.00;
                
                // Secuencia { nota, duración, tiempo de inicio }
                const notes = [
                    { f: E5, d: 0.15, t: 0.0 },
                    { f: E5, d: 0.15, t: 0.3 },
                    { f: E5, d: 0.15, t: 0.6 },
                    { f: C5, d: 0.15, t: 0.9 },
                    { f: E5, d: 0.15, t: 1.2 },
                    { f: G5, d: 0.30, t: 1.6 },
                    { f: G4, d: 0.30, t: 2.2 }
                ];

                const now = this.audioCtx.currentTime;
                notes.forEach(n => {
                    this.playNote(n.f, now + n.t, n.d);
                });

                // Reiniciar estado después de la melodía
                const timer = setTimeout(() => {
                    this.isPlaying = false;
                    // Disparar evento para actualizar UI
                    window.dispatchEvent(new Event('mario-synth-ended'));
                }, 2800);
                this.timeouts.push(timer);
            }

            stop() {
                this.timeouts.forEach(clearTimeout);
                this.timeouts = [];
                this.isPlaying = false;
            }
        }
        
        const synth = new MarioSynth();

        const Header = ({ searchQuery, setSearchQuery, weather }) => {
            const [isPlaying, setIsPlaying] = useState(false);

            useEffect(() => {
                const handleEnded = () => setIsPlaying(false);
                window.addEventListener('mario-synth-ended', handleEnded);
                return () => window.removeEventListener('mario-synth-ended', handleEnded);
            }, []);

            const toggleMusic = () => {
                if (isPlaying) {
                    synth.stop();
                    setIsPlaying(false);
                } else {
                    synth.playTheme();
                    setIsPlaying(true);
                }
            };

            return (
                <header className="glass-panel sticky top-0 z-40 px-6 py-4 shadow-sm flex flex-col md:flex-row justify-between items-center gap-4 rounded-b-2xl">
                    <div className="flex items-center gap-3">
                        <i className="ph-fill ph-calendar-blank text-3xl text-indigo-600"></i>
                        <h1 className="text-2xl font-bold text-gray-800">Mi Agenda 2026</h1>
                    </div>
                    
                    <div className="flex-1 max-w-md w-full relative">
                        <i className="ph ph-magnifying-glass absolute left-3 top-3 text-gray-400 text-lg"></i>
                        <input 
                            type="text" 
                            placeholder="Buscar eventos..." 
                            value={searchQuery}
                            onChange={(e) => setSearchQuery(e.target.value)}
                            className="w-full pl-10 pr-4 py-2 rounded-full border border-gray-300 bg-white/80 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all"
                        />
                    </div>

                    <div className="flex items-center gap-4">
                        {/* Indicador de Clima Hermosillo */}
                        <div className="flex items-center gap-2 bg-white/50 px-3 py-1.5 rounded-full shadow-sm text-sm font-medium">
                            {weather.icon && <i className={`ph-fill ${weather.icon} text-xl ${weather.color}`}></i>}
                            <div className="flex flex-col leading-tight text-right">
                                <span>{weather.temp}°C</span>
                                <span className="text-[10px] text-gray-500 uppercase tracking-wider">Hermosillo</span>
                            </div>
                        </div>

                        {/* Botón Web Audio API */}
                        <button 
                            onClick={toggleMusic}
                            className={`p-2 rounded-full shadow-md transition-all transform hover:scale-105 active:scale-95 ${isPlaying ? 'bg-indigo-600 text-white' : 'bg-white text-indigo-600'}`}
                            title="Reproducir tema (Web Audio API)"
                        >
                            <i className={`text-2xl ph-fill ${isPlaying ? 'ph-speaker-high' : 'ph-music-notes'}`}></i>
                        </button>
                    </div>
                </header>
            );
        };

        const Modal = ({ isOpen, onClose, date, events, title }) => {
            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/40 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="relative glass-panel bg-white w-full max-w-md rounded-2xl shadow-2xl p-6 transform transition-all flex flex-col max-h-[80vh]">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-xl font-bold text-gray-800">{title || `Agenda: ${date}`}</h2>
                            <button onClick={onClose} className="p-1 hover:bg-gray-200 rounded-full transition-colors">
                                <i className="ph ph-x text-xl"></i>
                            </button>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto pr-2">
                            {events.length === 0 ? (
                                <div className="text-center py-8 text-gray-500 flex flex-col items-center">
                                    <i className="ph ph-coffee text-4xl mb-2"></i>
                                    <p>No hay eventos registrados.</p>
                                </div>
                            ) : (
                                <ul className="space-y-3">
                                    {events.map((ev, i) => (
                                        <li key={i} style={{ backgroundColor: ev.color }} className="p-4 rounded-xl shadow-sm border border-black/5">
                                            <div className="flex items-center gap-3">
                                                <span className="text-2xl">{ev.emoji}</span>
                                                <div className="flex-1">
                                                    <h3 className="font-bold text-gray-900">{ev.title}</h3>
                                                    {ev.description && <p className="text-sm text-gray-700 mt-1">{ev.description}</p>}
                                                </div>
                                                {/* Mostrar fecha si es una lista de búsqueda */}
                                                {!date && <span className="text-xs font-semibold bg-white/50 px-2 py-1 rounded-md">{ev.date}</span>}
                                            </div>
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const CalendarMonth = ({ monthInfo, events, onDayClick }) => {
            const { name, index, days, startDay } = monthInfo;
            
            // Generar celdas vacías para el desfase del primer día
            const emptyCells = Array.from({ length: startDay }).map((_, i) => (
                <div key={`empty-${i}`} className="p-2 md:p-3 opacity-0"></div>
            ));

            const dayCells = Array.from({ length: days }).map((_, i) => {
                const dayNum = i + 1;
                // Formatear a YYYY-MM-DD
                const dateStr = `2026-${String(index + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                
                // Buscar eventos para este día
                const dayEvents = events.filter(e => e.date === dateStr);
                const hasEvents = dayEvents.length > 0;
                
                return (
                    <div 
                        key={dateStr}
                        onClick={() => onDayClick(dateStr, dayEvents)}
                        style={hasEvents ? { backgroundColor: dayEvents[0].color } : {}}
                        className={`aspect-square border border-gray-100 p-1 md:p-2 flex flex-col justify-between cursor-pointer rounded-xl transition-all hover:shadow-md hover:scale-105 ${hasEvents ? '' : 'bg-white hover:bg-indigo-50'}`}
                    >
                        <span className={`text-sm md:text-base font-semibold ${hasEvents ? 'text-gray-900' : 'text-gray-600'}`}>{dayNum}</span>
                        <div className="flex flex-wrap gap-1 justify-end items-end overflow-hidden h-full">
                            {dayEvents.map((ev, i) => i < 2 && ( // Mostrar máximo 2 emojis en la celda
                                <span key={i} className="text-xs md:text-sm drop-shadow-sm">{ev.emoji}</span>
                            ))}
                            {dayEvents.length > 2 && <span className="text-[10px] font-bold text-gray-600">+{dayEvents.length - 2}</span>}
                        </div>
                    </div>
                );
            });

            return (
                <div className="glass-panel p-4 md:p-6 rounded-3xl flex flex-col">
                    <h2 className="text-2xl font-black mb-4 text-gray-800 tracking-tight">{name} <span className="text-gray-400 font-normal">2026</span></h2>
                    <div className="grid grid-cols-7 gap-1 md:gap-2 mb-2">
                        {WEEKDAYS.map(day => (
                            <div key={day} className="text-center text-xs font-bold text-gray-400 uppercase tracking-wider">{day}</div>
                        ))}
                    </div>
                    <div className="grid grid-cols-7 gap-1 md:gap-2 flex-1">
                        {emptyCells}
                        {dayCells}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [events, setEvents] = useState([]);
            const [weather, setWeather] = useState({ temp: '--', icon: 'ph-sun', color: 'text-yellow-500', bgClass: 'bg-gradient-to-br from-blue-100 to-indigo-100' });
            const [searchQuery, setSearchQuery] = useState('');
            const [modalData, setModalData] = useState({ isOpen: false, date: null, events: [], title: '' });

            // Cargar Clima de Hermosillo
            useEffect(() => {
                const fetchWeather = async () => {
                    try {
                        // Coordenadas de Hermosillo, Sonora
                        const lat = 29.0892;
                        const lon = -110.9613;
                        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                        const data = await res.json();
                        
                        if (data.current_weather) {
                            const temp = Math.round(data.current_weather.temperature);
                            const code = data.current_weather.weathercode;
                            
                            // Mapear WMO Weather code a iconos y fondos
                            let icon = 'ph-sun';
                            let color = 'text-yellow-500';
                            let bgClass = 'bg-gradient-to-br from-blue-100 to-indigo-100'; // Soleado por defecto
                            
                            if (code >= 1 && code <= 3) {
                                icon = 'ph-cloud-sun';
                                color = 'text-gray-500';
                                bgClass = 'bg-gradient-to-br from-gray-200 to-blue-200'; // Nublado
                            } else if (code >= 51 && code <= 67 || code >= 80 && code <= 82) {
                                icon = 'ph-cloud-rain';
                                color = 'text-blue-500';
                                bgClass = 'bg-gradient-to-br from-slate-400 to-blue-300'; // Lluvia
                            } else if (code >= 95) {
                                icon = 'ph-cloud-lightning';
                                color = 'text-purple-500';
                                bgClass = 'bg-gradient-to-br from-gray-700 to-slate-500'; // Tormenta
                            }
                            
                            setWeather({ temp, icon, color, bgClass });
                            // Aplicar fondo al body
                            document.body.className = `min-h-screen text-slate-800 ${bgClass}`;
                        }
                    } catch (error) {
                        console.error("Error fetching weather:", error);
                    }
                };
                fetchWeather();
            }, []);

            // Cargar Eventos (Sheets o Mock)
            useEffect(() => {
                const loadEvents = async () => {
                    try {
                        let csvText = "";
                        if (GOOGLE_SHEETS_CSV_URL) {
                            const res = await fetch(GOOGLE_SHEETS_CSV_URL);
                            if (res.ok) {
                                csvText = await res.text();
                            } else {
                                throw new Error("No se pudo cargar la URL, usando datos de prueba.");
                            }
                        } else {
                            csvText = MOCK_CSV_DATA;
                        }
                        
                        const parsedEvents = parseCSV(csvText);
                        setEvents(parsedEvents);
                    } catch (error) {
                        console.warn(error);
                        setEvents(parseCSV(MOCK_CSV_DATA)); // Fallback
                    }
                };
                loadEvents();
            }, []);

            // Filtrar eventos por búsqueda
            const filteredEvents = useMemo(() => {
                if (!searchQuery.trim()) return [];
                const query = searchQuery.toLowerCase();
                return events.filter(ev => 
                    ev.title.toLowerCase().includes(query) || 
                    ev.description.toLowerCase().includes(query) ||
                    ev.date.includes(query)
                );
            }, [searchQuery, events]);

            // Efecto para abrir modal de búsqueda automáticamente si hay query
            useEffect(() => {
                if (searchQuery.trim()) {
                    setModalData({
                        isOpen: true,
                        date: null,
                        events: filteredEvents,
                        title: `Resultados para "${searchQuery}"`
                    });
                } else if (modalData.title.startsWith("Resultados")) {
                    // Cerrar si borran la búsqueda y estaban en modo búsqueda
                    setModalData(prev => ({ ...prev, isOpen: false }));
                }
            }, [searchQuery, filteredEvents]);

            const handleDayClick = (dateStr, dayEvents) => {
                // Formatear fecha bonita
                const dateObj = new Date(dateStr + 'T00:00:00');
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                const prettyDate = dateObj.toLocaleDateString('es-ES', options);

                setSearchQuery(''); // Limpiar búsqueda si hacen click en un día
                setModalData({
                    isOpen: true,
                    date: dateStr,
                    events: dayEvents,
                    title: prettyDate.charAt(0).toUpperCase() + prettyDate.slice(1)
                });
            };

            const closeModal = () => {
                setModalData(prev => ({ ...prev, isOpen: false }));
                if (searchQuery) setSearchQuery('');
            };

            // Componente de Propuestas de Eventos
            const EventProposals = () => {
                const [proposals, setProposals] = useState([]);
                const [newProposal, setNewProposal] = useState({ title: '', date: '' }); // 'author' se quita, lo pone el backend
                const [isSubmitting, setIsSubmitting] = useState(false);
                
                // Estado de Autenticación
                const [authStatus, setAuthStatus] = useState('checking'); // checking, authorized, unauthorized
                const [userEmail, setUserEmail] = useState('');
                
                // URL de tu Google Apps Script
                // ¡Asegúrate de poner la URL correcta aquí! Déjalo vacío ("") para probar el modo simulación.
                const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwl7LOmUzMqHPmfg5O9njZMzxLxCqEGPcJTmDZv6CLVRZFyps_KtTMYtJMXOoVxVjco/exec"; 

                // Verificar autorización al cargar el componente
                useEffect(() => {
                    const checkAuth = async () => {
                        // Entrar a simulación si la URL está vacía o es el placeholder de prueba
                        if(!APP_SCRIPT_URL || APP_SCRIPT_URL.includes('AKfycb')) {
                            setAuthStatus('authorized'); // Modo simulación local
                            setUserEmail('test@local.com');
                            return;
                        }
                        
                        try {
                            const res = await fetch(APP_SCRIPT_URL);
                            const data = await res.json();
                            
                            if (data.isAuthorized) {
                                setAuthStatus('authorized');
                                setUserEmail(data.email);
                            } else {
                                setAuthStatus('unauthorized');
                                setUserEmail(data.email || 'Desconocido');
                            }
                        } catch (error) {
                            // Cambiamos a console.warn para no saturar la consola con errores críticos de red
                            console.warn("Aviso de red (CORS/Bloqueo): No se pudo verificar la sesión. Mostrando como no autorizado.");
                            setAuthStatus('unauthorized');
                        }
                    };
                    checkAuth();
                }, []);

                const handleProposalSubmit = async (e) => {
                    e.preventDefault();
                    if(!newProposal.title || !newProposal.date) return;

                    setIsSubmitting(true);

                    // Modo simulación si no hay URL válida
                    if(!APP_SCRIPT_URL || APP_SCRIPT_URL.includes('AKfycb')) {
                        setTimeout(() => {
                            setProposals([{...newProposal, author: userEmail, id: Date.now()}, ...proposals]);
                            setNewProposal({ title: '', date: '' });
                            setIsSubmitting(false);
                        }, 500);
                        return;
                    }

                    try {
                        const formData = new FormData();
                        formData.append('title', newProposal.title);
                        formData.append('date', newProposal.date);
                        // El author ya no se envía desde aquí, el backend (App Script) usa el correo real

                        await fetch(APP_SCRIPT_URL, {
                            method: 'POST',
                            body: formData,
                            mode: 'no-cors' 
                        });
                        
                        setProposals([{...newProposal, author: userEmail, id: Date.now()}, ...proposals]);
                        setNewProposal({ title: '', date: '' });
                    } catch (error) {
                        console.error("Error enviando propuesta:", error);
                        alert("Hubo un error al enviar la propuesta.");
                    } finally {
                        setIsSubmitting(false);
                    }
                };

                return (
                    <div className="glass-panel p-6 rounded-3xl flex flex-col h-full">
                        <div className="flex items-center gap-2 mb-4">
                            <i className="ph-fill ph-lightbulb text-2xl text-yellow-500"></i>
                            <h2 className="text-xl font-bold text-gray-800">Proponer Eventos</h2>
                        </div>
                        
                        {/* Control de Acceso UI */}
                        {authStatus === 'checking' && (
                            <div className="flex flex-col items-center justify-center p-6 text-gray-500 bg-white/50 rounded-xl mb-6">
                                <i className="ph ph-spinner animate-spin text-3xl mb-2"></i>
                                <p className="text-sm">Verificando acceso...</p>
                            </div>
                        )}

                        {authStatus === 'unauthorized' && (
                            <div className="flex flex-col items-center justify-center p-6 bg-red-50 rounded-xl border border-red-100 mb-6 text-center">
                                <i className="ph-fill ph-lock-key text-4xl text-red-400 mb-2"></i>
                                <h3 className="font-bold text-red-800">Acceso Restringido</h3>
                                <p className="text-sm text-red-600 mt-1">
                                    Tu cuenta ({userEmail || 'no detectada'}) no tiene permisos para proponer eventos.
                                </p>
                            </div>
                        )}

                        {authStatus === 'authorized' && (
                            <form onSubmit={handleProposalSubmit} className="flex flex-col gap-3 mb-6 bg-white/50 p-4 rounded-xl">
                                <div className="text-xs text-green-700 bg-green-100 px-2 py-1 rounded-md mb-2 flex items-center gap-1 w-fit">
                                    <i className="ph-fill ph-check-circle"></i> Autenticado como {userEmail}
                                </div>
                                <input 
                                    type="text" 
                                    placeholder="Nombre del evento (ej. Posada)" 
                                    value={newProposal.title}
                                    onChange={e => setNewProposal({...newProposal, title: e.target.value})}
                                    required
                                    className="px-3 py-2 rounded-lg border border-gray-200 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                                />
                                <input 
                                    type="date" 
                                    value={newProposal.date}
                                    onChange={e => setNewProposal({...newProposal, date: e.target.value})}
                                    required
                                    min="2026-08-01"
                                    max="2026-12-31"
                                    className="w-full px-3 py-2 rounded-lg border border-gray-200 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                                />
                                <button 
                                    type="submit" 
                                    disabled={isSubmitting}
                                    className={`mt-2 py-2 px-4 rounded-lg font-bold text-white shadow-sm transition-all ${isSubmitting ? 'bg-indigo-300' : 'bg-indigo-600 hover:bg-indigo-700'}`}
                                >
                                    {isSubmitting ? 'Enviando...' : 'Enviar Propuesta'}
                                </button>
                            </form>
                        )}

                        <h3 className="font-semibold text-gray-700 mb-2">Propuestas Recientes:</h3>
                        <div className="flex-1 overflow-y-auto pr-2 space-y-2">
                            {proposals.length === 0 ? (
                                <p className="text-sm text-gray-500 italic text-center py-4">Aún no hay propuestas.</p>
                            ) : (
                                proposals.map((prop, i) => (
                                    <div key={prop.id || i} className="bg-white p-3 rounded-lg shadow-sm border border-gray-100 flex flex-col">
                                        <span className="font-bold text-sm">{prop.title}</span>
                                        <div className="flex justify-between items-center mt-1 text-xs text-gray-500">
                                            <span>📅 {prop.date}</span>
                                            <span className="bg-gray-100 px-2 py-1 rounded-md">👤 {prop.author}</span>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div className="max-w-7xl mx-auto pb-12">
                    <Header searchQuery={searchQuery} setSearchQuery={setSearchQuery} weather={weather} />
                    
                    <main className="px-4 py-8">
                        <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
                            {/* Calendario: Ocupa 3 columnas en pantallas grandes */}
                            <div className="lg:col-span-3 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {MONTHS.map(monthInfo => (
                                    <CalendarMonth 
                                        key={monthInfo.name} 
                                        monthInfo={monthInfo} 
                                        events={events} 
                                        onDayClick={handleDayClick}
                                    />
                                ))}
                                
                                {/* Panel informativo movido al final del calendario */}
                                <div className="glass-panel p-6 rounded-3xl flex flex-col justify-center items-center text-center">
                                    <div className="w-20 h-20 bg-white/60 rounded-full flex items-center justify-center mb-4 shadow-inner">
                                        <i className="ph-fill ph-file-csv text-4xl text-green-600"></i>
                                    </div>
                                    <h3 className="text-xl font-bold mb-2">Conectado a Datos</h3>
                                    <p className="text-sm text-gray-600 mb-4">
                                        Total de eventos registrados: <br/>
                                        <span className="text-2xl font-black text-indigo-600">{events.length}</span>
                                    </p>
                                </div>
                            </div>
                            
                            {/* Panel de Propuestas (Derecha): Ocupa 1 columna */}
                            <div className="lg:col-span-1 flex flex-col">
                                <EventProposals />
                            </div>
                        </div>
                    </main>

                    <Modal 
                        isOpen={modalData.isOpen} 
                        onClose={closeModal} 
                        date={modalData.date} 
                        events={modalData.events} 
                        title={modalData.title}
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
