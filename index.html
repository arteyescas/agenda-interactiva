<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Hermosillo 2026</title>
    
    <!-- Tailwind CSS para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React y ReactDOM para la UI interactiva -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel para compilar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Iconos Phosphor -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            transition: background 1s ease; 
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        /* Scrollbar estilizado */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.4); }
    </style>
</head>
<body class="min-h-screen text-slate-800 bg-gray-100 transition-colors duration-1000" id="body-bg">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // URL del CSV de Google Sheets (Reemplazar con tu URL de lectura pública)
        const GOOGLE_SHEETS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSJv3RnKGah_HW0wOLqpnYHUdNxw8TfwEMIyTirT_DJk-13_SPbOj8YGh6WWZCtc7q4A1pQUNLhijsr/pub?output=csv"; 
        
        // URL del Google Apps Script para guardar las propuestas
        const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwgfwtq4f_Xg8biTomsQNTDL9kyQYGcvEQuFiw548TNaxuhWZQBurArL_jyqdx63RUx/exec";

        // Datos de prueba con colores en HEX
        const MOCK_CSV_DATA = `Fecha,Titulo,Descripcion,Color,Emoji
2026-08-01,Inicio de mes,Planear objetivos,#bfdbfe,🚀
2026-08-15,Cena con amigos,Restaurante en el centro a las 8pm,#fef08a,🌮
2026-09-15,Grito de Independencia,Festejos patrios,#bbf7d0,🇲🇽
2026-10-31,Halloween,Fiesta de disfraces,#e9d5ff,🎃
2026-11-20,Día de la Revolución,Día festivo - descansar,#fecaca,🇲🇽
2026-12-24,Nochebuena,Cena familiar,#fecaca,🎄
2026-12-31,Fin de año,Despedir el 2026,#bfdbfe,🎆
2026-08-10,Junta de proyecto,Revisión de avances,#e2e8f0,💼
2026-10-12,Cita Médica,Chequeo general 10:00 AM,#bfdbfe,🩺`;

        const MONTHS = [
            { name: "Agosto", index: 7, days: 31, startDay: 6 }, 
            { name: "Septiembre", index: 8, days: 30, startDay: 2 }, 
            { name: "Octubre", index: 9, days: 31, startDay: 4 }, 
            { name: "Noviembre", index: 10, days: 30, startDay: 0 }, 
            { name: "Diciembre", index: 11, days: 31, startDay: 2 }, 
        ];
        const WEEKDAYS = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];

        const parseCSV = (csvText) => {
            const lines = csvText.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
            
            return lines.slice(1).map(line => {
                const values = line.split(','); 
                return {
                    date: values[0]?.trim(),
                    title: values[1]?.trim(),
                    description: values[2]?.trim() || "",
                    color: values[3]?.trim() || "#e5e7eb", // Fallback a gris claro en hex
                    emoji: values[4]?.trim() || "📌"
                };
            }).filter(event => event.date);
        };

        class MarioSynth {
            constructor() {
                this.audioCtx = null;
                this.isPlaying = false;
                this.timeouts = [];
            }

            init() {
                if (!this.audioCtx) {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playNote(frequency, startTime, duration) {
                if (!this.audioCtx) return;
                const osc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();
                
                osc.type = 'square'; 
                osc.frequency.value = frequency;
                
                osc.connect(gain);
                gain.connect(this.audioCtx.destination);
                
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.1, startTime + 0.05); 
                gain.gain.setValueAtTime(0.1, startTime + duration - 0.05);
                gain.gain.linearRampToValueAtTime(0, startTime + duration);
                
                osc.start(startTime);
                osc.stop(startTime + duration);
            }

            playTheme() {
                this.init();
                if (this.audioCtx.state === 'suspended') {
                    this.audioCtx.resume();
                }
                this.isPlaying = true;

                const E5 = 659.25, C5 = 523.25, G5 = 783.99, G4 = 392.00;
                const notes = [
                    { f: E5, d: 0.15, t: 0.0 },
                    { f: E5, d: 0.15, t: 0.3 },
                    { f: E5, d: 0.15, t: 0.6 },
                    { f: C5, d: 0.15, t: 0.9 },
                    { f: E5, d: 0.15, t: 1.2 },
                    { f: G5, d: 0.30, t: 1.6 },
                    { f: G4, d: 0.30, t: 2.2 }
                ];

                const now = this.audioCtx.currentTime;
                notes.forEach(n => {
                    this.playNote(n.f, now + n.t, n.d);
                });

                const timer = setTimeout(() => {
                    this.isPlaying = false;
                    window.dispatchEvent(new Event('mario-synth-ended'));
                }, 2800);
                this.timeouts.push(timer);
            }

            stop() {
                this.timeouts.forEach(clearTimeout);
                this.timeouts = [];
                this.isPlaying = false;
            }
        }
        
        const synth = new MarioSynth();

        const Header = ({ searchQuery, setSearchQuery, weather }) => {
            const [isPlaying, setIsPlaying] = useState(false);

            useEffect(() => {
                const handleEnded = () => setIsPlaying(false);
                window.addEventListener('mario-synth-ended', handleEnded);
                return () => window.removeEventListener('mario-synth-ended', handleEnded);
            }, []);

            const toggleMusic = () => {
                if (isPlaying) {
                    synth.stop();
                    setIsPlaying(false);
                } else {
                    synth.playTheme();
                    setIsPlaying(true);
                }
            };

            return (
                <header className="glass-panel sticky top-0 z-40 px-4 md:px-6 py-4 shadow-sm flex flex-col md:flex-row justify-between items-center gap-4 rounded-b-2xl mb-6">
                    <div className="flex items-center gap-3">
                        <i className="ph-fill ph-calendar-blank text-3xl text-indigo-600"></i>
                        <h1 className="text-2xl font-bold text-gray-800">Mi Agenda 2026</h1>
                    </div>
                    
                    <div className="flex-1 max-w-md w-full relative">
                        <i className="ph ph-magnifying-glass absolute left-3 top-3 text-gray-400 text-lg"></i>
                        <input 
                            type="text" 
                            placeholder="Buscar eventos..." 
                            value={searchQuery}
                            onChange={(e) => setSearchQuery(e.target.value)}
                            className="w-full pl-10 pr-4 py-2 rounded-full border border-gray-300 bg-white/80 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all"
                        />
                    </div>

                    <div className="flex items-center gap-4">
                        <div className="flex items-center gap-2 bg-white/50 px-3 py-1.5 rounded-full shadow-sm text-sm font-medium">
                            {weather.icon && <i className={`ph-fill ${weather.icon} text-xl ${weather.color}`}></i>}
                            <div className="flex flex-col leading-tight text-right">
                                <span>{weather.temp}°C</span>
                                <span className="text-[10px] text-gray-500 uppercase tracking-wider">Hermosillo</span>
                            </div>
                        </div>

                        <button 
                            onClick={toggleMusic}
                            className={`p-2 rounded-full shadow-md transition-all transform hover:scale-105 active:scale-95 ${isPlaying ? 'bg-indigo-600 text-white' : 'bg-white text-indigo-600'}`}
                            title="Reproducir tema (Web Audio API)"
                        >
                            <i className={`text-2xl ph-fill ${isPlaying ? 'ph-speaker-high' : 'ph-music-notes'}`}></i>
                        </button>
                    </div>
                </header>
            );
        };

        const Modal = ({ isOpen, onClose, date, events, title }) => {
            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/40 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="relative glass-panel bg-white w-full max-w-md rounded-2xl shadow-2xl p-6 transform transition-all flex flex-col max-h-[80vh]">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-xl font-bold text-gray-800">{title || `Agenda: ${date}`}</h2>
                            <button onClick={onClose} className="p-1 hover:bg-gray-200 rounded-full transition-colors">
                                <i className="ph ph-x text-xl"></i>
                            </button>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto pr-2">
                            {events.length === 0 ? (
                                <div className="text-center py-8 text-gray-500 flex flex-col items-center">
                                    <i className="ph ph-coffee text-4xl mb-2"></i>
                                    <p>No hay eventos registrados.</p>
                                </div>
                            ) : (
                                <ul className="space-y-3">
                                    {events.map((ev, i) => (
                                        <li key={i} style={{ backgroundColor: ev.color }} className="p-4 rounded-xl shadow-sm border border-black/5">
                                            <div className="flex items-center gap-3">
                                                <span className="text-2xl">{ev.emoji}</span>
                                                <div className="flex-1">
                                                    <h3 className="font-bold text-gray-900">{ev.title}</h3>
                                                    {ev.description && <p className="text-sm text-gray-700 mt-1">{ev.description}</p>}
                                                </div>
                                                {!date && <span className="text-xs font-semibold bg-white/50 px-2 py-1 rounded-md">{ev.date}</span>}
                                            </div>
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const CalendarMonth = ({ monthInfo, events, onDayClick }) => {
            const { name, index, days, startDay } = monthInfo;
            
            const emptyCells = Array.from({ length: startDay }).map((_, i) => (
                <div key={`empty-${i}`} className="p-2 md:p-3 opacity-0"></div>
            ));

            const dayCells = Array.from({ length: days }).map((_, i) => {
                const dayNum = i + 1;
                const dateStr = `2026-${String(index + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                const dayEvents = events.filter(e => e.date === dateStr);
                const hasEvents = dayEvents.length > 0;
                
                return (
                    <div 
                        key={dateStr}
                        onClick={() => onDayClick(dateStr, dayEvents)}
                        style={hasEvents ? { backgroundColor: dayEvents[0].color } : {}}
                        className={`aspect-square border border-gray-100 p-1 md:p-2 flex flex-col justify-between cursor-pointer rounded-xl transition-all hover:shadow-md hover:scale-105 ${hasEvents ? '' : 'bg-white hover:bg-indigo-50'}`}
                    >
                        <span className={`text-sm md:text-base font-semibold ${hasEvents ? 'text-gray-900' : 'text-gray-600'}`}>{dayNum}</span>
                        <div className="flex flex-wrap gap-1 justify-end items-end overflow-hidden h-full">
                            {dayEvents.map((ev, i) => i < 2 && ( 
                                <span key={i} className="text-xs md:text-sm drop-shadow-sm">{ev.emoji}</span>
                            ))}
                            {dayEvents.length > 2 && <span className="text-[10px] font-bold text-gray-600">+{dayEvents.length - 2}</span>}
                        </div>
                    </div>
                );
            });

            return (
                <div className="glass-panel p-4 md:p-6 rounded-3xl flex flex-col">
                    <h2 className="text-2xl font-black mb-4 text-gray-800 tracking-tight">{name} <span className="text-gray-400 font-normal">2026</span></h2>
                    <div className="grid grid-cols-7 gap-1 md:gap-2 mb-2">
                        {WEEKDAYS.map(day => (
                            <div key={day} className="text-center text-xs font-bold text-gray-400 uppercase tracking-wider">{day}</div>
                        ))}
                    </div>
                    <div className="grid grid-cols-7 gap-1 md:gap-2 flex-1">
                        {emptyCells}
                        {dayCells}
                    </div>
                </div>
            );
        };

        const EventProposals = () => {
            const [proposals, setProposals] = useState([]);
            const [email, setEmail] = useState('');
            const [title, setTitle] = useState('');
            const [date, setDate] = useState('');
            const [status, setStatus] = useState(''); // 'loading', 'success', 'error', ''
            const [errorMessage, setErrorMessage] = useState('');

            const handleProposalSubmit = async (e) => {
                e.preventDefault();
                setStatus('loading');
                setErrorMessage('');

                // Modo simulación si no hay URL configurada
                if (!APP_SCRIPT_URL || APP_SCRIPT_URL.trim() === "") {
                    setTimeout(() => {
                        if (email === 'test@local.com') {
                            setProposals([{ title, date, author: email }, ...proposals]);
                            setTitle('');
                            setDate('');
                            setStatus('success');
                        } else {
                            setStatus('error');
                            setErrorMessage("Simulación: Correo no autorizado. Usa 'test@local.com'");
                        }
                        setTimeout(() => setStatus(''), 3000);
                    }, 800);
                    return;
                }

                try {
                    // Usamos URLSearchParams para engañar a CORS enviando datos como formulario simple
                    const params = new URLSearchParams();
                    params.append('email', email);
                    params.append('title', title);
                    params.append('date', date);

                    const response = await fetch(APP_SCRIPT_URL, {
                        method: 'POST',
                        body: params
                    });

                    const data = await response.json();
                    
                    if (data.result === 'success') {
                        setProposals([{ title, date, author: email }, ...proposals]);
                        setTitle('');
                        setDate('');
                        setStatus('success');
                    } else {
                        setStatus('error');
                        setErrorMessage(data.error || "El correo no tiene permisos.");
                    }
                } catch (error) {
                    console.error("Error al enviar propuesta:", error);
                    setStatus('error');
                    setErrorMessage("Error de conexión. Verifica la URL de tu Script y que esté implementado como 'Cualquier persona'.");
                }
                
                setTimeout(() => setStatus(''), 5000);
            };

            return (
                <div className="glass-panel p-6 rounded-3xl h-full flex flex-col">
                    <h2 className="text-xl font-bold text-gray-800 mb-2 flex items-center gap-2">
                        <i className="ph-fill ph-lightbulb text-yellow-500"></i>
                        Proponer Evento
                    </h2>
                    <p className="text-sm text-gray-600 mb-6">Solo usuarios autorizados pueden proponer nuevos eventos a la agenda.</p>

                    <form onSubmit={handleProposalSubmit} className="space-y-4 mb-6">
                        <div>
                            <label className="block text-xs font-semibold text-gray-600 uppercase mb-1">Tu Correo Autorizado</label>
                            <input 
                                type="email" 
                                required 
                                value={email}
                                onChange={(e) => setEmail(e.target.value)}
                                placeholder="tu@correo.com"
                                className="w-full px-3 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                            />
                        </div>
                        <div>
                            <label className="block text-xs font-semibold text-gray-600 uppercase mb-1">Título del evento</label>
                            <input 
                                type="text" 
                                required 
                                value={title}
                                onChange={(e) => setTitle(e.target.value)}
                                placeholder="Ej: Posada Navideña"
                                className="w-full px-3 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                            />
                        </div>
                        <div>
                            <label className="block text-xs font-semibold text-gray-600 uppercase mb-1">Fecha Propuesta</label>
                            <input 
                                type="date" 
                                required
                                min="2026-08-01"
                                max="2026-12-31"
                                value={date}
                                onChange={(e) => setDate(e.target.value)}
                                className="w-full px-3 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                            />
                        </div>
                        
                        {status === 'error' && (
                            <div className="bg-red-100 text-red-700 p-3 rounded-lg text-sm font-medium">
                                ❌ {errorMessage}
                            </div>
                        )}
                        {status === 'success' && (
                            <div className="bg-green-100 text-green-700 p-3 rounded-lg text-sm font-medium">
                                ✅ ¡Propuesta enviada exitosamente!
                            </div>
                        )}

                        <button 
                            type="submit" 
                            disabled={status === 'loading'}
                            className="w-full bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-indigo-700 transition-colors disabled:bg-indigo-400 flex justify-center items-center gap-2"
                        >
                            {status === 'loading' ? (
                                <><i className="ph ph-spinner animate-spin text-lg"></i> Enviando...</>
                            ) : (
                                "Enviar Propuesta"
                            )}
                        </button>
                    </form>

                    <div className="flex-1 overflow-y-auto">
                        <h3 className="text-sm font-bold text-gray-700 mb-3 border-b pb-2">Propuestas Recientes</h3>
                        {proposals.length === 0 ? (
                            <p className="text-sm text-gray-500 italic text-center py-4">No hay propuestas aún en esta sesión.</p>
                        ) : (
                            <ul className="space-y-3">
                                {proposals.map((prop, idx) => (
                                    <li key={idx} className="bg-white/60 p-3 rounded-lg border border-gray-100 text-sm">
                                        <div className="font-semibold text-gray-800">{prop.title}</div>
                                        <div className="text-xs text-gray-500 flex justify-between mt-1">
                                            <span>📅 {prop.date}</span>
                                            <span className="truncate ml-2" title={prop.author}>👤 {prop.author.split('@')[0]}</span>
                                        </div>
                                    </li>
                                ))}
                            </ul>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [events, setEvents] = useState([]);
            const [searchQuery, setSearchQuery] = useState('');
            const [modalConfig, setModalConfig] = useState({ isOpen: false, date: null, events: [], title: '' });
            const [weather, setWeather] = useState({ temp: '--', icon: null, color: 'text-gray-500' });

            useEffect(() => {
                const fetchEvents = async () => {
                    try {
                        if (!GOOGLE_SHEETS_CSV_URL) throw new Error("No URL");
                        const res = await fetch(GOOGLE_SHEETS_CSV_URL);
                        const text = await res.text();
                        setEvents(parseCSV(text));
                    } catch (e) {
                        console.log("Usando datos locales de prueba");
                        setEvents(parseCSV(MOCK_CSV_DATA));
                    }
                };
                fetchEvents();
            }, []);

            useEffect(() => {
                const fetchWeather = async () => {
                    try {
                        // Coordenadas de Hermosillo, Sonora
                        const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=29.0892&longitude=-110.9613&current_weather=true");
                        const data = await res.json();
                        const code = data.current_weather.weathercode;
                        const temp = Math.round(data.current_weather.temperature);
                        
                        let icon = "ph-sun"; let color = "text-yellow-500"; let bg = "bg-blue-50";
                        if (code >= 1 && code <= 3) { icon = "ph-cloud-sun"; color = "text-gray-400"; bg = "bg-gray-100"; }
                        else if (code >= 51 && code <= 67) { icon = "ph-cloud-rain"; color = "text-blue-500"; bg = "bg-blue-100"; }
                        else if (code >= 71) { icon = "ph-snowflake"; color = "text-cyan-500"; bg = "bg-cyan-50"; }
                        else if (code >= 95) { icon = "ph-cloud-lightning"; color = "text-purple-500"; bg = "bg-slate-200"; }

                        setWeather({ temp, icon, color });
                        document.getElementById('body-bg').className = `min-h-screen text-slate-800 transition-colors duration-1000 ${bg}`;
                    } catch (e) {
                        console.error("Error al obtener el clima");
                    }
                };
                fetchWeather();
            }, []);

            const filteredEvents = useMemo(() => {
                if (!searchQuery) return events;
                const lowerQ = searchQuery.toLowerCase();
                return events.filter(e => 
                    e.title.toLowerCase().includes(lowerQ) || 
                    e.description.toLowerCase().includes(lowerQ)
                );
            }, [events, searchQuery]);

            const handleDayClick = (date, dayEvents) => {
                setModalConfig({ isOpen: true, date, events: dayEvents, title: `Agenda: ${date}` });
            };

            const openSearchResults = () => {
                setModalConfig({ isOpen: true, date: null, events: filteredEvents, title: `Resultados de: "${searchQuery}"` });
            };

            return (
                <div className="max-w-7xl mx-auto px-4 md:px-8 pb-12">
                    <Header searchQuery={searchQuery} setSearchQuery={setSearchQuery} weather={weather} />
                    
                    {searchQuery && (
                        <div className="mb-6 p-4 glass-panel rounded-xl flex justify-between items-center">
                            <span>Encontramos <strong>{filteredEvents.length}</strong> eventos para "{searchQuery}"</span>
                            <button onClick={openSearchResults} className="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-indigo-700 transition-colors">Ver resultados</button>
                        </div>
                    )}

                    <div className="flex flex-col lg:flex-row gap-6">
                        <div className="flex-1 grid grid-cols-1 md:grid-cols-2 gap-6">
                            {MONTHS.map(month => (
                                <CalendarMonth 
                                    key={month.name} 
                                    monthInfo={month} 
                                    events={filteredEvents} 
                                    onDayClick={handleDayClick}
                                />
                            ))}
                        </div>
                        
                        <div className="w-full lg:w-96 flex-shrink-0">
                            <EventProposals />
                        </div>
                    </div>

                    <Modal 
                        isOpen={modalConfig.isOpen} 
                        onClose={() => setModalConfig({ ...modalConfig, isOpen: false })} 
                        date={modalConfig.date} 
                        events={modalConfig.events} 
                        title={modalConfig.title}
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
